networks:
  media_net:
    external: true

services:
  cross-seed:
    image: ghcr.io/cross-seed/cross-seed:latest
    container_name: cross-seed
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
    volumes:
      - ${CROSS_SEED_CONFIG}:/config
    networks:
      - media_net
    restart: unless-stopped
    command: daemon
